card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px} .control{display:grid;gap:14px} .status{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px 22px;align-items:center} .order{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap} .order i{width:16px;height:2px;background:var(--muted);opacity:.6;border-radius:2px} .body{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-display);font-size:1.05rem;padding:4px 12px 4px 6px;background:var(--soft);border-radius:999px} .body::before{content:"";width:16px;height:16px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(60,50,20,.22)} .b-sun::before{background:var(--dot-sun)} .b-moon::before{background:var(--dot-moon)} .b-earth::before{background:var(--dot-earth)} .phase{display:flex;align-items:flex-start;gap:12px;min-width:0} .chip{flex:none;font-family:var(--font-display);font-size:1.05rem;padding:3px 12px;border-radius:999px;background:var(--soft);color:var(--ink);white-space:nowrap} .chip[data-kind="pen"]{background:var(--pen)} .chip[data-kind="partial"]{background:var(--mode-soft)} .chip[data-kind="total"]{background:var(--mode);color:var(--mode-ink)} .phase p{margin:0;min-height:3.2em;max-width:64ch} .player{display:flex;align-items:center;gap:12px} .play{flex:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-width:7.4rem;font-family:var(--font-display);font-size:1.15rem;padding:.6rem 1.2rem;border:0;border-radius:999px;background:var(--accent);color:var(--accent-ink)} .play svg{width:18px;height:18px;fill:currentColor} .ghost{flex:none;font-size:.95rem;padding:.55rem 1rem;border-radius:999px;border:1.5px solid var(--line);background:transparent;color:var(--ink)} .scrub{position:relative;flex:1;min-width:0;height:44px;display:flex;align-items:center} .track{position:absolute;left:12px;right:12px;top:50%;height:12px;margin-top:-6px;border-radius:999px;background:var(--soft);overflow:hidden} .seg{position:absolute;top:0;bottom:0} .seg-pen{background:var(--pen)} .seg-partial{background:var(--mode-soft)} .seg-total{background:var(--mode)} .scrub input{-webkit-appearance:none;appearance:none;position:relative;width:100%;height:44px;margin:0;background:transparent} .scrub input::-webkit-slider-runnable-track{height:12px;background:transparent} .scrub input::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;margin-top:-6px;border-radius:50%;background:var(--card);border:3px solid var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.25)} .scrub input::-moz-range-track{height:12px;background:transparent} .scrub input::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--card);border:3px solid var(--ink)} .scrub input:focus-visible{outline:none} .scrub input:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 4px var(--accent)} .scrub input:focus-visible::-moz-range-thumb{box-shadow:0 0 0 4px var(--accent)} .row2{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px 16px} .jumps{display:flex;flex-wrap:wrap;gap:6px} .jump{font-size:.95rem;display:inline-flex;align-items:center;gap:6px;padding:.3rem .8rem;border-radius:999px;border:1.5px solid var(--line);background:transparent;color:var(--ink)} .jump::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--soft);box-shadow:inset 0 0 0 1px var(--muted)} .jump[data-kind="pen"]::before{background:var(--pen)} .jump[data-kind="partial"]::before{background:var(--mode-soft)} .jump[data-kind="total"]::before{background:var(--mode);box-shadow:none} .jump[aria-current="true"]{border-color:var(--ink);background:var(--soft)} .speed{display:inline-flex;gap:2px;padding:4px;background:var(--soft);border-radius:999px} .speed button{font-size:.9rem;border:0;background:transparent;color:var(--muted);padding:.3rem .85rem;border-radius:999px} .speed button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(20,24,60,.14)} .learn{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:start} .compare h2,.qa-title{font-size:1.3rem;margin-bottom:10px} .stage{grid-template-areas:"space sky" "info sky";grid-template-rows:auto 1fr} .p-space{grid-area:space} .p-sky{grid-area:sky} .p-info{grid-area:info;align-self:start} .toggle-sky-wrap{display:inline-flex;align-items:center;gap:6px;font-size:0.95rem;background:var(--soft);padding:6px 14px;border-radius:999px;cursor:pointer} .toggle-sky-wrap input{cursor:pointer;width:16px;height:16px} @media (max-width:880px){.stage{grid-template-areas:"space" "sky" "info";grid-template-rows:auto}}
</style>

<div class="wrap" data-mode="solar">
  <div class="top">
    <div class="intro">
      <p class="eyebrow">지구과학 시뮬레이션</p>
      <h1>일식과 월식 관찰해보기</h1>
      <p class="lede">달이 지구 둘레를 돌다가 태양, 지구와 한 줄로 나란히 놓이면 그림자가 생겨요. 재생을 누르고 우주에서 본 모습과 지구에서 본 하늘을 함께 살펴보세요.</p>
    </div>
    <div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap;">
      <label class="toggle-sky-wrap">
        <input type="checkbox" id="chkToggleSky" checked> 우리나라 관찰 창 보기
      </label>
      <div class="modes" role="group" aria-label="시뮬레이션 모드">
        <button type="button" aria-pressed="true" data-mode="solar"><i class="mdot sun"></i>일식</button>
        <button type="button" aria-pressed="false" data-mode="lunar"><i class="mdot moon"></i>월식</button>
      </div>
    </div>
  </div>

  <div class="stage" id="simStage">
    <figure class="panel p-space">
      <figcaption>
        <strong>우주에서 본 모습</strong>
        <span id="txtSpaceGuide">북극 위에서 내려다봤어요. 달은 시계 반대 방향으로 돌아요.</span>
      </figcaption>
      <canvas class="cv-space" id="cvSpace" width="760" height="420" aria-label="우주에서 본 일식/월식 시뮬레이션"></canvas>
      <ul class="legend" id="spaceLegend">
        <li><span class="sw sw-umbra"></span>본그림자</li>
        <li><span class="sw sw-pen"></span>반그림자</li>
        <li><span class="sw sw-pin"></span>관측자 (오른쪽 위 방위표는 관측자 기준)</li>
        <li class="legend-note">크기와 거리는 실제와 달라요</li>
      </ul>
    </figure>

    <figure class="panel p-sky" id="panelSky">
      <figcaption>
        <strong id="lblSkyTitle">우리나라에서 보는 일식</strong>
        <span id="lblSkySub">서울 기준 (가상 시뮬레이션)</span>
      </figcaption>
      <canvas class="cv-sky" id="cvSky" width="400" height="400" aria-label="지구에서 본 하늘"></canvas>
      <div class="meter">
        <div class="meter-row">
          <span id="lblMeterName">태양이 가려지는 비율</span>
          <b id="txtSunRatio">0%</b>
        </div>
        <div class="bar"><span id="barSunRatio"></span></div>
      </div>
      <p class="safety" id="txtSafety"><b>안전 주의</b>태양을 직접 바라보면 눈이 다칠 수 있어요! 반드시 적절한 차광 필터를 사용해야 해요.</p>
    </figure>

    <div class="panel p-info" id="panelInfo">
      <div class="control" style="border:0; padding:0; background:transparent;">
        <div class="status">
          <div class="order" id="txtOrder">
            <span class="body b-sun">태양</span><i></i><span class="body b-moon">달</span><i></i><span class="body b-earth">지구</span>
          </div>
          <div class="phase">
            <span class="chip" id="txtPhaseChip" data-kind="partial">부분일식</span>
            <p id="txtPhaseDesc">달이 태양의 일부를 가리기 시작해요. 태양 모양이 찌그러져 보여요.</p>
          </div>
        </div>
        <div class="player">
          <button type="button" class="play" id="btnPlay" aria-label="재생">
            <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>재생
          </button>
          <div class="scrub">
            <div class="track" id="trackSegs"></div>
            <input type="range" id="rngTime" min="0" max="1000" value="0" step="1" aria-label="시뮬레이션 시간 조절">
          </div>
          <button type="button" class="ghost" id="btnReset">처부터</button>
        </div>
        <div class="row2">
          <div class="jumps" id="jumpList"></div>
          <div class="speed" role="group" aria-label="배속 조절">
            <button type="button" data-speed="0.5">느리게</button>
            <button type="button" aria-pressed="true" data-speed="1">보통</button>
            <button type="button" data-speed="2">빠르게</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  // 체크박스로 우측 우리나라 관찰창 숨기기/보이기 기능 연동
  const chkToggleSky = document.getElementById('chkToggleSky');
  const simStage = document.getElementById('simStage');
  chkToggleSky.addEventListener('change', () => {
    if(chkToggleSky.checked){
      simStage.classList.remove('hide-sky');
    } else {
      simStage.classList.add('hide-sky');
    }
  });

  // 기존 시뮬레이션 구동 스크립트 연결을 위한 기본 안전장치
  window.addEventListener('DOMContentLoaded', () => {
    console.log("일식/월식 시뮬레이션 로드 완료 (숨기기 옵션 포함)");
  });
</script>
